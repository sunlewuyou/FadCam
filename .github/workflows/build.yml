name: Build FadCam Release

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone patched Media3 for live streaming
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          echo "✓ Patched Media3 cloned"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup local.properties with release keystore
        run: |
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore

          if [ ! -f "$RUNNER_TEMP/release.keystore" ]; then
            echo "❌ Keystore creation failed"
            exit 1
          fi

          echo "✓ Keystore ready"

      - name: Build normal Release variant
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDefaultRelease

      - name: Find generated APK
        run: |
          echo "✓ Searching APK files..."

          find app/build/outputs/apk -name "*.apk" -type f -ls

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-release
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: Build summary
        run: |
          echo "## ✅ FadCam Release Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** Normal Release" >> $GITHUB_STEP_SUMMARY
          echo "**Variant:** defaultRelease" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
