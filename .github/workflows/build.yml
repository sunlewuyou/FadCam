name: Build FadCam Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Clone patched Media3 for live streaming
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          echo "✓ Patched Media3 cloned to /tmp/media3-patched"
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
          
      - name: Setup local.properties with release keystore
        run: |
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
          
      - name: Decode and write keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
          if [ ! -f "$RUNNER_TEMP/release.keystore" ]; then
            echo "❌ Keystore file not created"
            exit 1
          fi
          echo "✓ Keystore file created"
          
      - name: Build FadCam Release
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          
      - name: Verify APK was built
        run: |
          echo "✓ Checking built APK..."
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fadcam-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
      - name: Build summary
        run: |
          echo "## ✅ FadCam Release APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Details:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build Type: Release" >> $GITHUB_STEP_SUMMARY
          echo "- Package ID: com.fadcam" >> $GITHUB_STEP_SUMMARY
          echo "- Minified: Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- Shrink Resources: Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- ABI: arm64-v8a + armeabi-v7a + universal APK (if enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:**" >> $GITHUB_STEP_SUMMARY
          echo "APK is available in workflow artifacts." >> $GITHUB_STEP_SUMMARY